name: Build and release editions

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.1"
          cache: false
      - name: Install pinned Zig
        shell: bash
        run: |
          zig_version="0.16.0"
          zig_archive="${RUNNER_TEMP}/zig-${zig_version}.tar.xz"
          zig_dir="${RUNNER_TEMP}/zig-x86_64-linux-${zig_version}"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "${zig_archive}" \
            "https://ziglang.org/download/${zig_version}/zig-x86_64-linux-${zig_version}.tar.xz"
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  ${zig_archive}" | sha256sum -c -
          tar -xJf "${zig_archive}" -C "${RUNNER_TEMP}"
          test "$("${zig_dir}/zig" version)" = "${zig_version}"
          echo "${zig_dir}" >> "${GITHUB_PATH}"
      - name: Install official webOS packager
        run: npm ci
      - name: Build and verify pinned ARM cores
        run: |
          bash tools/build-cores.sh
          python tests/binary-provenance.test.py
      - name: Build official verification IPKs
        run: python build_ipk.py --edition all --output-dir build/verification-ipks
      - name: Syntax checks
        run: |
          node --check app/app.js
          find app/service -name '*.js' -print0 | xargs -0 -n1 node --check
          sh -n tools/build-cores.sh
          python -m py_compile build_ipk.py
      - name: Exact webOS 4 Node.js runtime checks
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output /tmp/node-v0.12.2-linux-x64.tar.gz \
            https://nodejs.org/dist/v0.12.2/node-v0.12.2-linux-x64.tar.gz
          echo "4e1578efc2a2cc67651413a05ccc4c5d43f6b4329c599901c556f24d93cd0508  /tmp/node-v0.12.2-linux-x64.tar.gz" | sha256sum -c -
          tar -xzf /tmp/node-v0.12.2-linux-x64.tar.gz -C /tmp
          old_node=/tmp/node-v0.12.2-linux-x64/bin/node
          "$old_node" tests/node012-syntax.test.js
          "$old_node" tests/node012-runtime.test.js
      - name: JavaScript tests
        run: |
          for test_file in tests/*.test.js; do
            echo "--- $test_file"
            node "$test_file"
          done
      - name: Python tests
        run: |
          for test_file in tests/*.test.py; do
            echo "--- $test_file"
            python "$test_file"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: alcyone-cores
          path: build/cores
          if-no-files-found: error

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        edition:
          - xray
          - sing-box
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v7
        with:
          name: alcyone-cores
          path: build/cores
      - name: Install official webOS packager
        run: npm ci
      - name: Build ${{ matrix.edition }} edition
        run: python build_ipk.py --edition "${{ matrix.edition }}" --output-dir dist
      - uses: actions/upload-artifact@v7
        with:
          name: alcyone-${{ matrix.edition }}
          path: dist/*.ipk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Publish canonical release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="docs/release-history/RELEASE_NOTES_${version}.md"
          # Matrix jobs verify both independent builds; release the exact bytes
          # referenced by the repository feed, manifests, and SHA256SUMS.
          assets=(
            "release-assets/Alcyone-XRay_${version}.ipk"
            "release-assets/Alcyone-sing-box_${version}.ipk"
          )
          for asset in "${assets[@]}"; do
            test -f "$asset"
          done
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "Alcyone ${version}" \
              --notes-file "$notes"
          fi
